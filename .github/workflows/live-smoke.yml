name: Live smoke test

# Weekly check that the listing selectors still match gofood.co.id. Kept out of the PR
# workflow so a site change shows up as a failing scheduled run, not a blocked pull request.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: browser-actions/setup-chrome@v1
      - run: pip install -e ".[dev]"
      - run: pytest -m live
